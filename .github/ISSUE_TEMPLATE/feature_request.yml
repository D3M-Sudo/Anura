name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/D3M-Sudo/Anura/issues) first.
        Focus on the user problem and use case; a detailed implementation plan is optional.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what limitation are you encountering?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe the outcome you would like Anura to provide.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention workarounds or alternative approaches, if any.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mock-ups or examples are welcome; remove private or sensitive data.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
