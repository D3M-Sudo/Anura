name: Temporary M1 F3 selector consumer audit

on:
  push:
    branches:
      - fix/ui-modernization-aligned
    paths:
      - .github/workflows/tmp-m1-f3-audit.yml

permissions:
  contents: read

jobs:
  selector-consumer-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@v4
      - name: Search all tracked files for candidate consumers
        shell: bash
        run: |
          set -uo pipefail
          patterns='anura-pulse|anura-spinner|anura-toast|share-row|welcome-page|welcome-card|language-popover|language-row|screenshot-btn'
          git grep -n -I -E "$patterns" -- . ':!data/style.css' > selector-consumers.txt || status=$?
          status=${status:-0}
          if [ "$status" -gt 1 ]; then
            echo "git grep failed with status $status"
            exit "$status"
          fi
          if [ -s selector-consumers.txt ]; then
            echo "Candidate references outside data/style.css:"
            cat selector-consumers.txt
          else
            echo "No candidate references found outside data/style.css."
          fi
          {
            echo "Commit: $(git rev-parse HEAD)"
            echo "Branch: $(git branch --show-current)"
            echo "Patterns: $patterns"
            echo
            cat selector-consumers.txt
          } > m1-f3-selector-audit.txt
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: m1-f3-selector-audit
          path: m1-f3-selector-audit.txt
          if-no-files-found: error
