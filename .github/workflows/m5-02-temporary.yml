name: Temporary M5-02 UI contract tests

on:
  push:
    branches: [ "fix/ui-modernization-aligned" ]
    paths:
      - ".github/workflows/m5-02-temporary.yml"
      - "tests/test_m5_02_*.py"
  pull_request:
    branches: [ "feature" ]
    paths:
      - ".github/workflows/m5-02-temporary.yml"
      - "tests/test_m5_02_*.py"

permissions:
  contents: read

jobs:
  m5-02:
    name: M5-02 GTK and action-contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      XDG_RUNTIME_DIR: /tmp/xdg-runtime-m5-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Diagnose and normalize M5-02 import ordering
        run: |
          pip install "ruff==0.17.5"
          ruff check --fix tests/test_m5_02_*.py
          sed -n '1,32p' tests/test_m5_02_menu_actions.py
          sed -n '1,32p' tests/test_m5_02_ui_contracts.py

      - name: Install GTK and Wayland test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            gir1.2-adw-1 libadwaita-1-dev \
            gir1.2-gtksource-5 libgtksourceview-5-dev \
            gir1.2-notify-0.7 libnotify-dev \
            gir1.2-xdp-1.0 libportal1 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 python3-gst-1.0 \
            libxml2-utils blueprint-compiler \
            tesseract-ocr tesseract-ocr-eng weston xwayland xvfb

      - name: Install project test dependencies
        run: |
          pip install "uv==0.13.5"
          uv venv --system-site-packages .venv
          uv sync --locked --dev

      - name: Compile Blueprint, GResource and GSettings assets
        run: |
          for blp in data/ui/*.blp; do
            blueprint-compiler compile "$blp" --output "${blp%.blp}.ui"
          done
          glib-compile-resources data/io.github.d3m_sudo.anura.gresource.xml \
            --sourcedir=data --sourcedir=data/ui \
            --target=data/io.github.d3m_sudo.anura.gresource
          mkdir -p builddir/data
          cp data/io.github.d3m_sudo.anura.gschema.xml builddir/data/
          glib-compile-schemas builddir/data/

      - name: Start Xvfb and Weston with a Wayland seat
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac >/tmp/xvfb-m5-02.log 2>&1 &
          for i in $(seq 1 20); do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 0.25
          done
          test -S /tmp/.X11-unix/X99
          DISPLAY=:99 nohup weston --backend=x11 --renderer=pixman \
            --width=1920 --height=1080 --socket=wayland-m5-02 --no-config \
            >/tmp/weston-m5-02.log 2>&1 &
          for i in $(seq 1 20); do
            [ -S "$XDG_RUNTIME_DIR/wayland-m5-02" ] && break
            sleep 0.5
          done
          test -S "$XDG_RUNTIME_DIR/wayland-m5-02"
          env DISPLAY='' GDK_BACKEND=wayland WAYLAND_DISPLAY=wayland-m5-02 \
            uv run python -c 'import gi; gi.require_version("Gdk", "4.0"); gi.require_version("Gtk", "4.0"); from gi.repository import Gdk, Gtk; Gtk.init(); assert Gdk.Display.get_default().get_default_seat() is not None'

      - name: Run headless menu action-scope contract
        run: uv run pytest -q -o addopts='' tests/test_m5_02_menu_actions.py

      - name: Run GTK shortcuts and toast tests
        env:
          DISPLAY: ""
          GDK_BACKEND: wayland
          WAYLAND_DISPLAY: wayland-m5-02
          NO_AT_BRIDGE: "1"
          GTK_A11Y: none
        run: uv run pytest -q -o addopts='' tests/test_m5_02_ui_contracts.py
