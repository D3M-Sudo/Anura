name: Dependency Sync

# Automatically keep uv.lock and the Flatpak manifests in sync whenever a
# Dependabot PR updates pyproject.toml.
#
# Dependabot (package-ecosystem: pip) only updates pyproject.toml. Without this
# workflow the uv.lock file and the Python modules hardcoded in
# flatpak/*.json would silently drift away from the declared dependencies.

on:
  pull_request:
    types: [opened, synchronize]
    branches: [testing, development]
    paths:
      - "pyproject.toml"

permissions:
  contents: write

concurrency:
  group: dependency-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.pull_request.user.login == 'app/dependabot'
    runs-on: ubuntu-latest
    env:
      UV_VERSION: "0.8.14"
    steps:
      - name: Checkout PR branch
        # We deliberately checkout the pull request HEAD (not the merge ref)
        # so any commits we push land on the Dependabot branch itself and are
        # included in the PR.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Regenerate uv.lock
        # Re-resolves the dependency tree so uv.lock matches the new
        # pyproject.toml constraints proposed by Dependabot.
        run: uv lock

      - name: Sync Flatpak Python modules
        # Reads uv.lock and updates URL + sha256 of the Python modules in
        # flatpak/*.json. Exits non-zero if the manifests are out of sync
        # (in which case the commit step below is skipped and the job fails).
        run: |
          python3 build-aux/sync_dependencies.py --update
          python3 build-aux/sync_dependencies.py --check

      - name: Commit and push sync changes
        run: |
          if ! git diff --quiet; then
            git add uv.lock flatpak/io.github.d3msudo.anura.json flatpak/io.github.d3msudo.anura.local.json
            git commit -m "chore(deps): sync uv.lock and flatpak manifests"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "No sync changes needed (already up to date)."
          fi