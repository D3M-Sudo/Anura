name: M2-B Task 1 — Welcome GTK validation (temporary)

on:
  push:
    branches:
      - fix/ui-modernization-aligned
    paths:
      - .github/workflows/m2b-welcome-validation.yml
      - anura/widgets/welcome_page.py
      - data/ui/welcome_page.blp
      - tests/test_widgets.py
      - tests/test_welcome_page_accessibility.py
      - data/io.github.d3m_sudo.anura.gresource.xml
      - data/io.github.d3m_sudo.anura.gschema.xml
  pull_request:
    branches:
      - feature
    paths:
      - .github/workflows/m2b-welcome-validation.yml
      - anura/widgets/welcome_page.py
      - data/ui/welcome_page.blp
      - tests/test_widgets.py
      - tests/test_welcome_page_accessibility.py
      - data/io.github.d3m_sudo.anura.gresource.xml
      - data/io.github.d3m_sudo.anura.gschema.xml

permissions:
  contents: read

concurrency:
  group: m2b-welcome-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  welcome-gtk:
    name: Welcome GTK / Blueprint tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      XDG_RUNTIME_DIR: /tmp/xdg-runtime-ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install GTK, Libadwaita and test system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            gir1.2-adw-1 libadwaita-1-dev \
            gir1.2-gtksource-5 libgtksourceview-5-dev \
            gir1.2-notify-0.7 libnotify-dev \
            gir1.2-xdp-1.0 libportal1 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 python3-gst-1.0 \
            libxml2-utils blueprint-compiler \
            tesseract-ocr tesseract-ocr-eng \
            weston xwayland

      - name: Install project and development dependencies
        run: |
          uv venv --system-site-packages
          uv sync --dev

      - name: Compile Blueprint templates
        run: |
          for blp in data/ui/*.blp; do
            blueprint-compiler compile "$blp" --output "${blp%.blp}.ui"
          done
          echo "Compiled $(find data/ui -maxdepth 1 -name '*.ui' | wc -l) Blueprint template(s)"

      - name: Compile GResources and GSettings schema
        run: |
          glib-compile-resources \
            data/io.github.d3m_sudo.anura.gresource.xml \
            --sourcedir=data \
            --sourcedir=data/ui \
            --target=data/io.github.d3m_sudo.anura.gresource
          mkdir -p builddir/data
          cp data/io.github.d3m_sudo.anura.gschema.xml builddir/data/
          glib-compile-schemas builddir/data/

      - name: Start headless Wayland compositor
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          nohup weston --backend=headless --socket=wayland-test --no-config >/tmp/weston.log 2>&1 &
          echo $! > /tmp/weston.pid
          for i in $(seq 1 20); do
            if [ -S "$XDG_RUNTIME_DIR/wayland-test" ]; then
              echo "Wayland compositor ready (attempt ${i}/20)"
              break
            fi
            sleep 0.5
          done
          if [ ! -S "$XDG_RUNTIME_DIR/wayland-test" ]; then
            cat /tmp/weston.log
            exit 1
          fi
          echo "WAYLAND_DISPLAY=wayland-test" >> "$GITHUB_ENV"
          echo "GSETTINGS_SCHEMA_DIR=$GITHUB_WORKSPACE/builddir/data" >> "$GITHUB_ENV"

      - name: Run Welcome GTK regression tests
        run: |
          uv run pytest \
            tests/test_widgets.py \
            tests/test_welcome_page_accessibility.py \
            -m gtk -v --timeout=30 \
            --override-ini "addopts=-v --tb=short"

      - name: Stop headless Wayland compositor
        if: always()
        run: |
          kill "$(cat /tmp/weston.pid 2>/dev/null)" 2>/dev/null || true
          pkill -x weston 2>/dev/null || true
          rm -f "$XDG_RUNTIME_DIR/wayland-test" /tmp/weston.pid
