name: Check Flatpak Dependencies

on:
  schedule:
    # Run weekly (same as Dependabot)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-flatpak-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for available updates
        id: check
        run: |
          # Writable HOME/cache for the FEDC container so it never tries to
          # create an inaccessible "/.cache" as a non-root user.
          FEDC_HOME="$RUNNER_TEMP/fedc-home"
          mkdir -p "$FEDC_HOME"

          for manifest in flatpak/io.github.d3msudo.anura.json flatpak/io.github.d3msudo.anura.local.json; do
            if [ -f "$manifest" ]; then
              docker run --rm \
                --user $(id -u):$(id -g) \
                -e HOME=/tmp/fedc-home \
                -v "$FEDC_HOME:/tmp/fedc-home" \
                -v "${{ github.workspace }}:/github/workspace" \
                -w /github/workspace \
                ghcr.io/flathub-infra/flatpak-external-data-checker:latest \
                --update --edit-only \
                "/github/workspace/$manifest"
            fi
          done

          if git diff --quiet flatpak/io.github.d3msudo.anura.json flatpak/io.github.d3msudo.anura.local.json; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Updates found:"
            git diff flatpak/io.github.d3msudo.anura.json flatpak/io.github.d3msudo.anura.local.json
          fi

      - name: Create PR for dependency updates
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '📦 Flatpak Python dependencies need manual update';
            const body = `## Available Updates

            The following Python dependencies in the Flatpak manifest have updates available:

            \`\`\`
            ${{ steps.check.outputs.updates }}
            \`\`\`

            ### Action Required
            These dependencies require manual testing before update:
            - gTTS - API may change
            - Pillow - Breaking changes possible
            - pytesseract - Check compatibility with tesseract version
            - Others - Verify runtime compatibility

            ### Files to update
            - \`flatpak/io.github.d3msudo.anura.json\`

            Run locally:
            \`\`\`bash
            flatpak-external-data-checker --update flatpak/io.github.d3msudo.anura.json
            flatpak-builder builddir flatpak/io.github.d3msudo.anura.json --force-clean
            \`\`\`

            _This issue was automatically created by the Flatpak dependency checker._`;

            // Check if an open issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies',
              creator: 'github-actions[bot]'
            });

            const existing = issues.data.find(i => i.title === title);

            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['dependencies']
              });
            }

      - name: Auto-update certifi only
        run: |
          # The general FEDC pass intentionally reports all available updates,
          # but those updates require manual review. Restore the checkout before
          # the automatic certifi pass so its PR cannot contain other updates.
          git restore -- flatpak/io.github.d3msudo.anura.json flatpak/io.github.d3msudo.anura.local.json

          # FEDC has no supported filter-by-source-name option. Isolate certifi
          # in a temporary manifest so --update can only modify that source.
          FEDC_HOME="$RUNNER_TEMP/fedc-home"
          TMP_DIR="$RUNNER_TEMP/fedc-certifi"
          mkdir -p "$FEDC_HOME" "$TMP_DIR"

          MANIFEST="flatpak/io.github.d3msudo.anura.json"
          CERTIFI_MANIFEST="$TMP_DIR/io.github.d3msudo.anura.certifi.json"

          python3 .github/scripts/fedc_certifi.py isolate "$MANIFEST" "$CERTIFI_MANIFEST"

          docker run --rm \
            --user $(id -u):$(id -g) \
            -e HOME=/tmp/fedc-home \
            -v "$FEDC_HOME:/tmp/fedc-home" \
            -v "${{ github.workspace }}:/github/workspace" \
            -v "$TMP_DIR:/tmp/fedc-certifi" \
            -w /github/workspace \
            ghcr.io/flathub-infra/flatpak-external-data-checker:latest \
            --update \
            "/tmp/fedc-certifi/io.github.d3msudo.anura.certifi.json"

          python3 .github/scripts/fedc_certifi.py replace "$MANIFEST" "$CERTIFI_MANIFEST"

          echo "Certifi-only update completed. Resulting diff:"
          git diff --check
          git diff -- flatpak/io.github.d3msudo.anura.json

      - name: Create PR for certifi updates
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: testing
          commit-message: "chore(deps): update certifi via FEDC"
          title: "chore(deps): update certifi via FEDC"
          body: |
            Automated certifi update via flatpak-external-data-checker.

            The FEDC invocation uses a temporary manifest containing only the certifi source because the current FEDC CLI does not support filtering by source name.

            Please review and test before merging.
          branch: update-certifi
          delete-branch: true
          labels: dependencies
