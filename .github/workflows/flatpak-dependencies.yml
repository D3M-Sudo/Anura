name: Check Flatpak Dependencies

on:
  schedule:
    # Run weekly (same as Dependabot)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-flatpak-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for available updates
        id: check
        run: |
          # Writable HOME/cache for the FEDC container so it never tries to
          # create an inaccessible "/.cache" as a non-root user.
          FEDC_HOME="$RUNNER_TEMP/fedc-home"
          mkdir -p "$FEDC_HOME"

          for manifest in flatpak/io.github.d3msudo.anura.json flatpak/io.github.d3msudo.anura.local.json; do
            if [ -f "$manifest" ]; then
              docker run --rm \
                --user $(id -u):$(id -g) \
                -e HOME=/tmp/fedc-home \
                -v "$FEDC_HOME:/tmp/fedc-home" \
                -v "${{ github.workspace }}:/github/workspace" \
                -w /github/workspace \
                ghcr.io/flathub-infra/flatpak-external-data-checker:latest \
                --update --edit-only \
                "/github/workspace/$manifest"
            fi
          done

          if git diff --quiet flatpak/io.github.d3msudo.anura.json flatpak/io.github.d3msudo.anura.local.json; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Updates found:"
            git diff flatpak/io.github.d3msudo.anura.json flatpak/io.github.d3msudo.anura.local.json
          fi

      - name: Create PR for dependency updates
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '📦 Flatpak Python dependencies need manual update';
            const body = `## Available Updates

            The following Python dependencies in the Flatpak manifest have updates available:

            \`\`\`
            ${{ steps.check.outputs.updates }}
            \`\`\`

            ### Action Required
            These dependencies require manual testing before update:
            - gTTS - API may change
            - Pillow - Breaking changes possible
            - pytesseract - Check compatibility with tesseract version
            - Others - Verify runtime compatibility

            ### Files to update
            - \`flatpak/io.github.d3msudo.anura.json\`

            Run locally:
            \`\`\`bash
            flatpak-external-data-checker --update flatpak/io.github.d3msudo.anura.json
            flatpak-builder builddir flatpak/io.github.d3msudo.anura.json --force-clean
            \`\`\`

            _This issue was automatically created by the Flatpak dependency checker._`;

            // Check if an open issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies',
              creator: 'github-actions[bot]'
            });

            const existing = issues.data.find(i => i.title === title);

            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['dependencies']
              });
            }

      - name: Auto-update certifi only
        run: |
          # Writable HOME/cache for the FEDC container.
          FEDC_HOME="$RUNNER_TEMP/fedc-home"
          mkdir -p "$FEDC_HOME"

          # Apply only certifi updates automatically (security-critical, stable API)
          # FEDC exits with code 1 when it applies updates, 0 when no updates needed.
          # docker run propagates the container's exit code.
          set +e
          docker run --rm \
            --user $(id -u):$(id -g) \
            -e HOME=/tmp/fedc-home \
            -v "$FEDC_HOME:/tmp/fedc-home" \
            -v "${{ github.workspace }}:/github/workspace" \
            -w /github/workspace \
            ghcr.io/flathub-infra/flatpak-external-data-checker:latest \
            --update \
            --filter python3-certifi \
            "/github/workspace/flatpak/io.github.d3msudo.anura.json"
          FEDC_EXIT_CODE=$?
          set -e

          # Exit code 1 means updates were applied (expected), 0 means no updates needed
          if [ $FEDC_EXIT_CODE -ne 0 ] && [ $FEDC_EXIT_CODE -ne 1 ]; then
            echo "Error: flatpak-external-data-checker failed with exit code $FEDC_EXIT_CODE"
            exit 1
          fi

          echo "Certifi check completed (exit code: $FEDC_EXIT_CODE)"

      - name: Create PR for certifi updates
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: testing
          commit-message: "chore(deps): update Flatpak dependencies via FEDC"
          title: "chore(deps): update Flatpak dependencies"
          body: |
            Automated update of Flatpak dependencies via flatpak-external-data-checker.

            Only sources with `x-checker-data` in the manifest are updated.
            Please review and test before merging.
          branch: update-flatpak-deps
          delete-branch: true
          labels: dependencies
