name: CI Quality Check & Release

permissions:
  contents: read

on:
  push:
    branches: [ "main", "development", "testing", "feature" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "development", "testing", "feature" ]

jobs:
  # JOB 1: Python code analysis and linting
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          # Strict linting with enforcement - no automatic fixes in CI.
          # Uses configuration from pyproject.toml.
          args: check --target-version py312

      - name: Install uv and project dependencies
        # Pin uv so a new release cannot change resolution behaviour between
        # runs, and sync in --locked mode so an out-of-date uv.lock fails the
        # build instead of being silently rewritten (#488).
        run: |
          pip install "uv==0.13.5"
          uv sync --locked --dev

      - name: Check code formatting
        # Configuration in pyproject.toml; Markdown is excluded because the
        # formatter would rewrite fenced code blocks in docs and agent rules.
        run: uv run ruff format --check --diff .

      - name: Run type checker
        # Non-strict by design (see [tool.mypy]); catches real regressions in
        # the production tree without blocking on the untyped-GTK backlog.
        run: uv run mypy

      - name: Run security linter
        # Bandit does not auto-discover pyproject.toml: the explicit -c is what
        # applies the tests/ exclusion (see [tool.bandit]).
        run: uv run bandit -c pyproject.toml -r .

      - name: Detect dead code (non-blocking)
        # Known findings are tracked as debt; report only, never fail the build.
        run: uv run vulture anura/ || true

      - name: Run tests with coverage
        env:
          ANURA_CI_TEST_MODE: "1"
        run: |
          # The --ignore flags below mirror the addopts list in pyproject.toml.
          # They are kept explicit here so the gtk-tests job can override
          # addopts independently and collect those files without them.
          # Keep in sync with pyproject.toml [tool.pytest.ini_options] addopts.
          uv run pytest tests/ -m "not gtk" \
            --ignore=tests/test_clipboard_service.py \
            --ignore=tests/test_screenshot_service.py \
            --ignore=tests/test_share_service.py \
            --ignore=tests/test_tts_service.py \
            --ignore=tests/test_notification_service.py \
            --ignore=tests/test_language_manager.py \
            --ignore=tests/test_tts_initialization.py \
            --ignore=tests/test_app_lifecycle.py \
            --ignore=tests/test_widgets.py \
            --ignore=tests/test_audit_app_logic.py \
            --ignore=tests/test_integration_cli_enterprise.py \
            --ignore=tests/test_security_download_limit.py \
            --cov=anura --cov-report=xml --cov-report=term-missing

      - name: Check Flatpak runtime dependency coverage (F-005)
        # Ensure every runtime Python dependency in uv.lock (resolved from
        # pyproject.toml) is represented by a python3-* module in the local
        # Flatpak manifest. Fails when a new direct/transitive runtime
        # dependency has no matching manifest module, so it can never ship a
        # broken Flatpak. Checks the local manifest only: the release
        # manifest is generated from it by build-aux/release.sh and is only
        # guaranteed to match right after a release (checked there instead,
        # in --manifest both mode, as a post-generation self-check).
        run: python3 build-aux/check_runtime_dependency_coverage.py --manifest local --arch x86_64 --arch aarch64

  gtk-tests:
    name: GTK Integration Tests
    runs-on: ubuntu-24.04
    needs: python-quality
    # Robustness: prevent job from hanging indefinitely
    timeout-minutes: 15
    # XDG_RUNTIME_DIR is required by weston to create its Wayland socket.
    # Setting it at the job level makes it available to every step.
    env:
      XDG_RUNTIME_DIR: /tmp/xdg-runtime-ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            gir1.2-adw-1 libadwaita-1-dev \
            gir1.2-gtksource-5 libgtksourceview-5-dev \
            gir1.2-notify-0.7 libnotify-dev \
            gir1.2-xdp-1.0 libportal1 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 python3-gst-1.0 \
            libxml2-utils \
            blueprint-compiler \
            tesseract-ocr tesseract-ocr-eng \
            weston xwayland

      - name: Install Python dependencies (with system site-packages)
        # The venv must inherit apt-installed PyGObject and Libadwaita modules.
        run: |
          pip install uv
          uv venv --system-site-packages .venv
          uv sync --dev

      - name: Compile Blueprint UI files
        # .ui files are build artifacts from .blp sources and are no longer
        # tracked in git. Regenerate them before compiling the GResource bundle.
        run: |
          for blp in data/ui/*.blp; do
            blueprint-compiler compile "$blp" --output "${blp%.blp}.ui"
          done
          echo "Compiled $(find data/ui -maxdepth 1 -name '*.ui' | wc -l) .ui file(s)"

      - name: Compile GResources
        # Write the bundle to the path resolved by the application's resource loader.
        run: |
          glib-compile-resources \
            data/io.github.d3m_sudo.anura.gresource.xml \
            --sourcedir=data \
            --sourcedir=data/ui \
            --target=data/io.github.d3m_sudo.anura.gresource

      - name: Compile GSettings schema
        run: |
          mkdir -p builddir/data
          cp data/io.github.d3m_sudo.anura.gschema.xml builddir/data/
          glib-compile-schemas builddir/data/

      - name: Start Wayland compositor (headless)
        # Keep Weston running across workflow steps; the GTK test step owns cleanup.
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          nohup weston --backend=headless --socket=wayland-test --no-config \
            >/tmp/weston.log 2>&1 &
          echo $! > /tmp/weston.pid

          # Poll for the socket for up to 10 s (20 × 500 ms).
          echo "Waiting for Wayland socket…"
          for i in $(seq 1 20); do
            if [ -S "$XDG_RUNTIME_DIR/wayland-test" ]; then
              echo "Wayland compositor ready (attempt ${i}/20)"
              break
            fi
            sleep 0.5
          done

          if [ ! -S "$XDG_RUNTIME_DIR/wayland-test" ]; then
            echo "::error::Weston did not create the wayland-test socket within 10 s"
            kill "$(cat /tmp/weston.pid)" 2>/dev/null || true
            exit 1
          fi

      - name: Run GTK tests (Wayland headless)
        # --override-ini replaces the global addopts from pyproject.toml.
        # Without this override the --ignore list baked into addopts would
        # suppress collection of the files that hold most gtk-marked tests.
        #
        # The cleanup trap lives here (not in the weston setup step) so that
        # weston is kept alive for the full duration of the test run and is
        # only stopped once pytest exits — whether it passes, fails, or times out.
        env:
          GSETTINGS_SCHEMA_DIR: builddir/data
          DISPLAY: ""
          WAYLAND_DISPLAY: wayland-test
          NO_AT_BRIDGE: "1"
          GTK_A11Y: none
          ANURA_LOG_LEVEL: WARNING
        run: |
          cleanup() {
            echo "::group::Cleanup remaining processes"
            echo "Stopping Weston and orphaned workers..."
            kill "$(cat /tmp/weston.pid 2>/dev/null)" 2>/dev/null || true
            pkill -x weston 2>/dev/null || true
            rm -f "$XDG_RUNTIME_DIR/wayland-test" /tmp/weston.pid
            echo "Cleanup complete."
            echo "::endgroup::"
          }
          trap cleanup EXIT

          # GTK tests register Adw.Application instances on D-Bus. Their shutdown
          # hooks must quit the applications so GLib/GDBus threads do not keep
          # the pytest process alive after the test session completes.
          uv run pytest tests/ -m gtk -v --timeout=30 \
            --override-ini "addopts=-v --tb=short"

  # JOB 2: Flatpak build and optional release
  flatpak-builder:
    name: Flatpak build (${{ matrix.variant.arch }})
    needs: [python-quality, gtk-tests]
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - name: Configure git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        env:
          EXPECTED_FLATPAK_ARCH: ${{ matrix.variant.arch }}
        run: |
          case "$(uname -m)" in
            x86_64) ACTUAL_FLATPAK_ARCH=x86_64 ;;
            aarch64|arm64) ACTUAL_FLATPAK_ARCH=aarch64 ;;
            *) echo "::error::Unsupported runner architecture: $(uname -m)"; exit 1 ;;
          esac
          if [ "$ACTUAL_FLATPAK_ARCH" != "$EXPECTED_FLATPAK_ARCH" ]; then
            echo "::error::Expected $EXPECTED_FLATPAK_ARCH runner, got $ACTUAL_FLATPAK_ARCH"
            exit 1
          fi
          echo "Verified native runner architecture: $ACTUAL_FLATPAK_ARCH"

      - name: Purge build caches and artifacts
        run: |
          rm -rf .flatpak-builder/
          rm -rf _build/
          rm -rf builddir/
          echo "Caches purged. Proceeding with clean build."

      - name: Generate release-style Flatpak manifest
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          # Lint the real submission shape (public repository URL + release tag).
          python3 build-aux/generate_release_manifest.py \
            --input flatpak/io.github.d3m_sudo.anura.local.json \
            --output flatpak/.ci-release/io.github.d3m_sudo.anura.json \
            --version "$VERSION"
          # Build the exact checked-out source without a network Git fetch.
          python3 build-aux/generate_release_manifest.py \
            --input flatpak/io.github.d3m_sudo.anura.local.json \
            --output flatpak/.ci-build/io.github.d3m_sudo.anura.json \
            --version "$VERSION" \
            --source-path ../.. \
            --source-commit "$GITHUB_SHA"

      - name: Validate local and generated release manifests
        run: |
          echo "=== Validating local manifest ==="
          flatpak-builder --show-manifest flatpak/io.github.d3m_sudo.anura.local.json > /dev/null
          echo "=== Comparing every shared release field ==="
          python3 build-aux/check_manifest_consistency.py \
            --local flatpak/io.github.d3m_sudo.anura.local.json \
            --release flatpak/.ci-release/io.github.d3m_sudo.anura.json
          echo "=== Running Flathub manifest lint ==="
          flatpak-builder-lint manifest flatpak/.ci-release/io.github.d3m_sudo.anura.json
          echo "✓ Local and generated release manifests validated"

      - name: Build Anura Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.7.0
        with:
          bundle: io.github.d3m_sudo.anura-${{ matrix.variant.arch }}.flatpak
          manifest-path: flatpak/.ci-build/io.github.d3m_sudo.anura.json
          arch: ${{ matrix.variant.arch }}
          upload-artifact: false
          cache: false
          keep-build-dirs: true
          state-dir: .flatpak-builder

      - name: Prove Flatpak build works without source downloads
        # Reuse the source cache populated by the preceding clean build. A
        # fresh build directory plus --disable-download proves every source
        # needed by the generated manifest is already declared and cached.
        run: |
          flatpak-builder --force-clean --disable-download --disable-rofiles-fuse \
            --arch=${{ matrix.variant.arch }} \
            --state-dir=.flatpak-builder \
            builddir-offline \
            flatpak/.ci-build/io.github.d3m_sudo.anura.json

      - name: Verify Blueprint and Resource Structure
        run: |
          echo "=== Verifying generated UI files ==="
          GRESOURCE_XML="data/io.github.d3m_sudo.anura.gresource.xml"
          BUILD_ROOT=$(find .flatpak-builder/build -maxdepth 1 -type d -name 'anura*' | head -1)
          if [ -z "$BUILD_ROOT" ]; then
            echo "✗ ERROR: Build directory not found"
            exit 1
          fi
          echo "Found build directory: $BUILD_ROOT"
          UI_FILES=$(find "$BUILD_ROOT" -name "*.ui" -type f 2>/dev/null)
          UI_COUNT=$(echo "$UI_FILES" | grep -c . || echo 0)
          if [ "$UI_COUNT" -eq 0 ]; then
            echo "✗ ERROR: No .ui files found"
            exit 1
          fi
          echo "✓ Found $UI_COUNT .ui file(s)"
          MISSING=0
          # Use python for robust regex matching of .ui files in gresource.xml
          for file in $(python3 -c "import re; xml = open('$GRESOURCE_XML').read(); print('\n'.join(re.findall(r'<file[^>]*>([^<]+\.ui)</file>', xml)))"); do
            # Strip potential ui/ prefix if present in gresource.xml
            clean_file=$(echo "$file" | sed 's|^ui/||')
            if ! echo "$UI_FILES" | grep -q "/$clean_file$"; then
              echo "✗ Missing: $clean_file"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "✗ RESOURCE VERIFICATION FAILED: $MISSING file(s) missing"
            exit 1
          fi
          echo "✓ All gresource.xml references resolved"

      - name: Smoke Test - Headless Runtime
        run: |
          echo "=== Installing bundle for smoke test ==="
          # Use --no-pull to avoid attempting to contact flathub during bundle install
          flatpak install --user --noninteractive --no-pull --bundle "io.github.d3m_sudo.anura-${{ matrix.variant.arch }}.flatpak"
          APP_REF="$(flatpak info --user --show-ref io.github.d3m_sudo.anura)"
          APP_ARCH="$(printf '%s' "$APP_REF" | cut -d/ -f3)"
          if [ "$APP_ARCH" != "${{ matrix.variant.arch }}" ]; then
            echo "::error::Bundle architecture mismatch: expected ${{ matrix.variant.arch }}, got $APP_ARCH ($APP_REF)"
            exit 1
          fi
          echo "Verified installed Flatpak ref: $APP_REF"
          echo "=== Running smoke test ==="
          if ! xvfb-run -a flatpak run \
              --env=NO_AT_BRIDGE=1 \
              --env=GTK_A11Y=none \
              --env=AT_SPI_BUS_ADDRESS=disabled \
              --env=LIBGL_ALWAYS_SOFTWARE=1 \
              io.github.d3m_sudo.anura --help; then
            echo "✗ Smoke test failed"
            exit 1
          fi
          if ! flatpak list --user | grep -q io.github.d3m_sudo.anura; then
            echo "✗ App not found in installation"
            exit 1
          fi
          echo "✓ Smoke test passed"

      - name: Validate GI typelibs and native runtime bindings
        # Run the checks with the interpreter and libraries visible inside the
        # installed Flatpak, not on the host runner. Xvfb supplies a display
        # for GTK initialization while keeping the test independent of a
        # physical desktop session.
        run: |
          xvfb-run -a flatpak run \
            --command=python3 \
            io.github.d3m_sudo.anura \
            -c "$(cat build-aux/flatpak_runtime_smoke.py)" \
            "${{ matrix.variant.arch }}"

      - name: Functional test - OCR in the sandbox
        run: |
          echo "=== OCR su immagine valida dentro sandbox ==="
          flatpak override --user --filesystem="$PWD/data/screenshots:ro"
          if ! timeout 120 xvfb-run -a flatpak run io.github.d3m_sudo.anura \
               -f "$PWD/data/screenshots/anura-welcome-page.png" --silent; then
            echo "✗ OCR failed inside the sandbox"; exit 1
          fi
          echo "✓ OCR passed inside the sandbox"

      - name: Functional test - OCR negativo su file non immagine
        run: |
          echo "=== OCR negativo su file non immagine (.txt) ==="
          echo "non è un'immagine valida" > /tmp/notanimage.txt
          flatpak override --user --filesystem=/tmp:ro
          OCR_LOG=/tmp/anura-ocr-negative.log
          if timeout 120 xvfb-run -a flatpak run io.github.d3m_sudo.anura \
               -f /tmp/notanimage.txt --silent >"$OCR_LOG" 2>&1; then
            cat "$OCR_LOG"
            echo "✗ OCR non dovrebbe avere successo su un .txt"; exit 1
          fi
          if grep -q "Traceback (most recent call last)" "$OCR_LOG"; then
            cat "$OCR_LOG"
            echo "::error::Invalid OCR input produced an uncaught Python traceback"
            exit 1
          fi
          echo "✓ OCR negativo correttamente fallito senza traceback"

      - name: Locate the installed prefix
        id: prefix
        run: |
          APP_DIR="$(flatpak info --user --show-location io.github.d3m_sudo.anura)"
          if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR/files" ]; then
            echo "✗ Installed app files not found (flatpak info returned '$APP_DIR')"
            exit 1
          fi
          echo "prefix=$APP_DIR/files" >> "$GITHUB_OUTPUT"
          echo "Using prefix: $APP_DIR/files"

      - name: Validate desktop file and AppStream metadata
        # Validate the installed launcher and AppStream metadata before publication.
        run: |
          PREFIX="${{ steps.prefix.outputs.prefix }}"
          desktop-file-validate "$PREFIX/share/applications/io.github.d3m_sudo.anura.desktop"
          appstreamcli validate --no-net \
            "$PREFIX/share/metainfo/io.github.d3m_sudo.anura.metainfo.xml"

      - name: Check the licence inventory
        # Fails when a declared licence is missing or empty, and keeps the full
        # listing as evidence for the release review (#493).
        run: |
          python3 build-aux/check_license_inventory.py \
            --root "${{ steps.prefix.outputs.prefix }}" \
            --output license-inventory.json

      - name: Upload licence inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-inventory-${{ github.run_id }}-${{ matrix.variant.arch }}
          path: license-inventory.json
          retention-days: 30

      - name: Upload Flatpak Artifact (Debug)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anura-flatpak-${{ github.run_id }}-${{ matrix.variant.arch }}
          path: io.github.d3m_sudo.anura-${{ matrix.variant.arch }}.flatpak
          retention-days: 7



  # Native self-contained AppImage builds; artifacts never cross architectures.
  appimage-builder:
    name: AppImage build (${{ matrix.variant.arch }})
    needs: python-quality
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            apt_arch: amd64
            apt_snapshot_url: https://snapshot.ubuntu.com/ubuntu/20261105T000000Z/
            runner: ubuntu-24.04
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - arch: aarch64
            apt_arch: arm64
            apt_snapshot_url: https://snapshot.ubuntu.com/ubuntu/20261105T000000Z/
            runner: ubuntu-24.04-arm
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    runs-on: ${{ matrix.variant.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native runner architecture and install build tools
        env:
          EXPECTED_ARCH: ${{ matrix.variant.arch }}
        run: |
          case "$(uname -m)" in
            x86_64) ACTUAL_ARCH=x86_64 ;;
            aarch64|arm64) ACTUAL_ARCH=aarch64 ;;
            *) echo "::error::Unsupported runner architecture: $(uname -m)"; exit 1 ;;
          esac
          test "$ACTUAL_ARCH" = "$EXPECTED_ARCH" || {
            echo "::error::Expected native $EXPECTED_ARCH runner, got $ACTUAL_ARCH"
            exit 1
          }
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-dev python3-apt python3-gi \
            blueprint-compiler gobject-introspection \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gtksource-5 \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev \
            desktop-file-utils gettext libglib2.0-bin \
            zsync xvfb xauth file binutils libfuse2t64 liblzo2-2 libegl1 curl
      - name: Install pinned AppImage tooling
        env:
          APPIMAGETOOL_SHA256: ${{ matrix.variant.appimagetool_sha256 }}
          APPIMAGETOOL_RUNTIME_SHA256: ${{ matrix.variant.runtime_sha256 }}
          APPIMAGETOOL_ARCH: ${{ matrix.variant.arch }}
        run: |
          python3 -m venv --system-site-packages .appimage-tools
          . .appimage-tools/bin/activate
          python -m pip install "appimage-builder==1.1.0" "uv==0.13.5"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${APPIMAGETOOL_ARCH}.AppImage" \
            -o appimagetool
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum --check
          chmod +x appimagetool
          sudo install -m 0755 appimagetool /usr/local/bin/appimagetool
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${APPIMAGETOOL_ARCH}" \
            -o appimage-runtime
          echo "$APPIMAGETOOL_RUNTIME_SHA256  appimage-runtime" | sha256sum --check
          chmod 0755 appimage-runtime
          sudo install -m 0755 appimage-runtime /usr/local/lib/appimage-runtime
          echo "APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime" >> "$GITHUB_ENV"
          appimage-builder --version
          appimagetool --version
          uv --version
      - name: Build architecture-specific AppImage
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          APPIMAGE_ARCH: ${{ matrix.variant.arch }}
          APT_ARCH: ${{ matrix.variant.apt_arch }}
          APT_SNAPSHOT_URL: ${{ matrix.variant.apt_snapshot_url }}
        run: |
          . .appimage-tools/bin/activate
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          else
            APP_VERSION="${APP_VERSION#v}"
          fi
          export APP_VERSION APPIMAGE_ARCH APT_ARCH APT_SNAPSHOT_URL
          GENERATED_RECIPE=build-aux/appimage/AppImageBuilder.ci.yml
          trap 'rm -f "$GENERATED_RECIPE"' EXIT
          sed \
            -e "s|{{APP_VERSION}}|$APP_VERSION|g" \
            -e "s|{{APPIMAGE_ARCH}}|$APPIMAGE_ARCH|g" \
            -e "s|{{APT_ARCH}}|$APT_ARCH|g" \
            -e "s|{{APT_SNAPSHOT_URL}}|$APT_SNAPSHOT_URL|g" \
            build-aux/appimage/AppImageBuilder.yml > "$GENERATED_RECIPE"
          if grep -q '{{[A-Z_]*}}' "$GENERATED_RECIPE"; then
            echo "::error::Unresolved AppImage recipe variable"
            exit 1
          fi
          python build-aux/appimage/appimage_builder_compat.py --self-test
          # appimage-builder is used only to resolve and stage the AppDir.
          # Its generated AppRun2 is discarded: it is affected by the known
          # glibc compatibility-runtime failure on matching host/bundle glibc.
          APPIMAGE_EXTRACT_AND_RUN=1 python \
            build-aux/appimage/appimage_builder_compat.py \
            --recipe "$GENERATED_RECIPE" --skip-test
          IMAGE="Anura-$APP_VERSION-$APPIMAGE_ARCH.AppImage"
          test -s "$IMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 "./$IMAGE" --appimage-extract >/dev/null
          test -d squashfs-root/usr
          # appimage-builder resolves and deploys these packages, but its
          # symlink staging omits the runtime sonames on clean amd64/arm64
          # images. Copy the architecture-matched loader names explicitly.
          bash build-aux/appimage/stage_runtime_libraries.sh squashfs-root \
            "$([[ "$APPIMAGE_ARCH" == x86_64 ]] && echo x86_64-linux-gnu || echo aarch64-linux-gnu)"
          sed "s|{{APP_VERSION}}|$APP_VERSION|g" build-aux/appimage/AppRun > squashfs-root/AppRun
          chmod 0755 squashfs-root/AppRun
          rm -f "$IMAGE" "$IMAGE.zsync"
          UPDATE_INFORMATION="gh-releases-zsync|D3M-Sudo|Anura|latest|Anura-*-$APPIMAGE_ARCH.AppImage.zsync"
          appimagetool --no-appstream --updateinformation "$UPDATE_INFORMATION" squashfs-root "$IMAGE"
          test -s "$IMAGE"
          # Generate the control file from the final, repackaged AppImage.
          # Keep the asset URL relative because both files ship side-by-side
          # in the same GitHub Release.
          zsyncmake -e -C -u "$IMAGE" -o "$IMAGE.zsync" "$IMAGE"
          test -s "$IMAGE.zsync"
          grep -q "^Filename: $IMAGE$" "$IMAGE.zsync"
          grep -q "^URL: $IMAGE$" "$IMAGE.zsync"
          # Ensure the final image contains our shell entrypoint, not AppRun2.
          rm -rf squashfs-root
          APPIMAGE_EXTRACT_AND_RUN=1 "./$IMAGE" --appimage-extract >/dev/null
          head -n 1 squashfs-root/AppRun | grep -q '^#!/bin/sh$'
          grep -q 'appimage_entrypoint.py' squashfs-root/AppRun
      - name: Verify AppImage architecture and embedded update metadata
        env:
          EXPECTED_ARCH: ${{ matrix.variant.arch }}
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          else
            APP_VERSION="${APP_VERSION#v}"
          fi
          IMAGE="Anura-$APP_VERSION-$EXPECTED_ARCH.AppImage"
          case "$EXPECTED_ARCH" in
            x86_64) readelf -h "$IMAGE" | grep -q 'Advanced Micro Devices X86-64' ;;
            aarch64) readelf -h "$IMAGE" | grep -q 'AArch64' ;;
          esac
          test -s "$IMAGE.zsync"
          UPDATE_INFORMATION="gh-releases-zsync|D3M-Sudo|Anura|latest|Anura-*-$EXPECTED_ARCH.AppImage.zsync"
          "./$IMAGE" --appimage-updateinformation > update-information.txt
          grep -Fxq "$UPDATE_INFORMATION" update-information.txt
          grep -q "Anura-$APP_VERSION-$EXPECTED_ARCH.AppImage" "$IMAGE.zsync"
      - name: Smoke test extracted AppImage on a clean Ubuntu host
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          APPIMAGE_ARCH: ${{ matrix.variant.arch }}
        run: |
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          else
            APP_VERSION="${APP_VERSION#v}"
          fi
          IMAGE="Anura-$APP_VERSION-$APPIMAGE_ARCH.AppImage"
          chmod +x "$IMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 "./$IMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -s squashfs-root/usr/share/licenses/io.github.d3m_sudo.anura/AppImage-type2-runtime-LICENSE
          test -s squashfs-root/usr/share/doc/libgtk-4-1/copyright
          test -s squashfs-root/usr/share/doc/tesseract-ocr/copyright
          docker run --rm \
            -v "$PWD/squashfs-root:/opt/anura:ro" \
            -v "$PWD/build-aux/appimage/audit_elf_dependencies.sh:/usr/local/bin/audit_elf_dependencies.sh:ro" \
            ubuntu:24.04 bash -euxc '
              apt-get update -qq
              apt-get install -y --no-install-recommends xvfb xauth dbus-x11 ca-certificates file binutils
              case "$(dpkg --print-architecture)" in
                amd64) APP_LIBDIR=x86_64-linux-gnu ;;
                arm64) APP_LIBDIR=aarch64-linux-gnu ;;
                *) echo "::error::Unexpected smoke-test architecture"; exit 1 ;;
              esac
              export LD_LIBRARY_PATH="/opt/anura/usr/lib/$APP_LIBDIR:/opt/anura/usr/lib"
              echo "=== Auditing the declared Anura runtime ELF dependency scope ==="
              bash /usr/local/bin/audit_elf_dependencies.sh --self-test
              bash /usr/local/bin/audit_elf_dependencies.sh /opt/anura "$APP_LIBDIR"
              NO_AT_BRIDGE=1 GTK_A11Y=none LIBGL_ALWAYS_SOFTWARE=1 \
                APPDIR=/opt/anura timeout 90 dbus-run-session -- xvfb-run -a /opt/anura/AppRun --help
            '
      - name: Upload AppImage and zsync CI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anura-appimage-${{ github.run_id }}-${{ matrix.variant.arch }}
          path: |
            Anura-*.AppImage
            Anura-*.AppImage.zsync
          if-no-files-found: error
          retention-days: 14

  validate-appimage-artifacts:
    name: Validate complete AppImage release set
    needs: appimage-builder
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download architecture-specific AppImages and zsync files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: anura-appimage-${{ github.run_id }}-*
          path: release-appimages
          merge-multiple: true
      - name: Validate exact AppImage/zsync pairs and generate checksums
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          python3 build-aux/validate_appimage_artifacts.py \
            --directory release-appimages --version "$VERSION" \
            --checksum-file SHA256SUMS-appimage
      - name: Upload validated AppImage checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-appimage-checksums-${{ github.run_id }}
          path: SHA256SUMS-appimage
          retention-days: 30

  # Verify that the artifact hand-off contains exactly one non-empty bundle
  # for each supported architecture before any tag-triggered publication.
  validate-release-artifacts:
    name: Validate multi-architecture release artifacts
    needs: flatpak-builder
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download architecture-specific Flatpak bundles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: anura-flatpak-${{ github.run_id }}-*
          path: release-assets
          merge-multiple: true

      - name: Validate bundle set and generate SHA-256 checksums
        run: python3 build-aux/validate_release_artifacts.py --directory release-assets --checksum-file SHA256SUMS

      - name: Upload release checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums-${{ github.run_id }}
          path: SHA256SUMS
          retention-days: 30


  # Publish both architecture bundles together; parallel matrix jobs must not
  # race while attaching assets to the same GitHub Release.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [flatpak-builder, validate-release-artifacts, appimage-builder, validate-appimage-artifacts]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download architecture-specific Flatpak bundles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: anura-flatpak-${{ github.run_id }}-*
          path: release-assets
          merge-multiple: true

      - name: Download validated SHA-256 checksums
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-checksums-${{ github.run_id }}
          path: release-checksums

      - name: Download architecture-specific AppImages and zsync files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: anura-appimage-${{ github.run_id }}-*
          path: release-assets
          merge-multiple: true
      - name: Download validated AppImage SHA-256 checksums
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-appimage-checksums-${{ github.run_id }}
          path: release-checksums-appimage

      - name: Build release notes from CHANGELOG
        # Never publish a release with an empty body (#489).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 build-aux/generate_release_notes.py --markdown CHANGELOG.md "$VERSION" "$(date -u +%F)" > release-notes.md
          test -s release-notes.md

      - name: Upload Flatpak Bundles to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-assets/*.flatpak
            release-checksums/SHA256SUMS
            release-assets/*.AppImage
            release-assets/*.AppImage.zsync
            release-checksums-appimage/SHA256SUMS-appimage
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

