name: M3 GNOME 51 icon compatibility (temporary)
on:
  pull_request:
    branches: [feature]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  gnome-51-icons:
    name: Verify application icon names in GNOME 51 SDK
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install isolated pytest
        run: |
          python3 -m venv --system-site-packages .m3-test-venv
          .m3-test-venv/bin/pip install pytest
      - name: Check GNOME 51 icon theme
        env:
          ANURA_GNOME_RUNTIME_ICON_CHECK: "1"
        run: |
          set -eu
          cat /etc/os-release
          GTK_TYPELIB="$(find /var/lib/flatpak/runtime/org.gnome.Platform/x86_64/51 -type f -name 'Gtk-4.0.typelib' -print -quit)"
          if [ -z "$GTK_TYPELIB" ]; then
            echo "Gtk-4.0.typelib not found in the GNOME 51 Platform runtime" >&2
            exit 1
          fi

          GTK_RUNTIME_FILES="$(dirname "$(dirname "$(dirname "$(dirname "$GTK_TYPELIB")")")")"
          GTK_LIBRARY="$(find "$GTK_RUNTIME_FILES" \( -type f -o -type l \) -name 'libgtk-4.so.1' -print -quit)"
          if [ -z "$GTK_LIBRARY" ]; then
            echo "libgtk-4.so.1 not found in the GNOME 51 Platform runtime" >&2
            exit 1
          fi

          GTK_TYPELIB_DIR="$(dirname "$GTK_TYPELIB")"
          GTK_LINK_DIR="$(mktemp -d)"
          RUNTIME_LOADER="$(find "$GTK_RUNTIME_FILES" \( -type f -o -type l \) -name 'ld-linux-x86-64.so.2' -print -quit)"
          RUNTIME_LIBC="$(find "$GTK_RUNTIME_FILES" \( -type f -o -type l \) -name 'libc.so.6' -print -quit)"
          if [ -z "$RUNTIME_LOADER" ] || [ -z "$RUNTIME_LIBC" ]; then
            echo "GNOME 51 runtime dynamic loader or glibc not found" >&2
            exit 1
          fi

          # GTK 4.18 in GNOME 51 requires the runtime's glibc (GLIBC_2.43).
          # Run Python under that runtime loader instead of injecting GNOME
          # libraries into the older container loader.
          RUNTIME_LIB_PATH="$(dirname "$RUNTIME_LOADER"):$(dirname "$RUNTIME_LIBC"):$(dirname "$GTK_LIBRARY"):$GTK_LINK_DIR:/app/lib:/usr/lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:/usr/lib:/lib"
          export GI_TYPELIB_PATH="$GTK_TYPELIB_DIR:/app/lib/girepository-1.0"
          ln -s "$GTK_LIBRARY" "$GTK_LINK_DIR/libgtk-4.so.1"

          echo "GNOME 51 runtime loader: $RUNTIME_LOADER"
          echo "GNOME 51 runtime glibc: $RUNTIME_LIBC"
          echo "GNOME 51 GTK library: $GTK_LIBRARY"
          echo "Runtime library path: $RUNTIME_LIB_PATH"
          echo "Python executable: $(readlink -f .m3-test-venv/bin/python)"

          # xvfb-run itself remains on the container runtime. Only the
          # Python/GTK test process is launched with GNOME 51's loader+glibc.
          xvfb-run -a env LD_LIBRARY_PATH="$RUNTIME_LIB_PATH" \
            "$RUNTIME_LOADER" --library-path "$RUNTIME_LIB_PATH" \
            .m3-test-venv/bin/python -m pytest -q tests/test_gnome51_icon_compatibility.py
