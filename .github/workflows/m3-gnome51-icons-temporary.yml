name: M3 GNOME 51 icon compatibility (temporary)
on:
  pull_request:
    branches: [feature]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  gnome-51-icons:
    name: Verify application icon names in GNOME 51 SDK
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install isolated pytest
        run: |
          python3 -m venv --system-site-packages .m3-test-venv
          .m3-test-venv/bin/pip install pytest
      - name: Check GNOME 51 icon theme
        env:
          ANURA_GNOME_RUNTIME_ICON_CHECK: "1"
        run: |
          set -eu
          cat /etc/os-release
          GTK_TYPELIB="$(find /var/lib/flatpak/runtime/org.gnome.Platform/x86_64/51 -type f -name 'Gtk-4.0.typelib' -print -quit)"
          if [ -z "$GTK_TYPELIB" ]; then
            echo "Gtk-4.0.typelib not found in the GNOME 51 Platform runtime" >&2
            exit 1
          fi

          GTK_RUNTIME_FILES="$(dirname "$(dirname "$(dirname "$(dirname "$GTK_TYPELIB")")")")"
          GTK_LIBRARY="$(find "$GTK_RUNTIME_FILES" \( -type f -o -type l \) -name 'libgtk-4.so.1' -print -quit)"
          if [ -z "$GTK_LIBRARY" ]; then
            echo "libgtk-4.so.1 not found in the GNOME 51 Platform runtime" >&2
            exit 1
          fi

          GTK_TYPELIB_DIR="$(dirname "$GTK_TYPELIB")"
          GTK_LINK_DIR="$(mktemp -d)"
          export GI_TYPELIB_PATH="$GTK_TYPELIB_DIR:/app/lib/girepository-1.0"
          ln -s "$GTK_LIBRARY" "$GTK_LINK_DIR/libgtk-4.so.1"

          # Expose only GTK's missing runtime dependencies via a private link
          # directory. Never prepend the complete runtime lib directory:
          # that can shadow the container's glibc and trigger GLIBC_PRIVATE.
          for pass in 1 2 3 4 5 6 7 8; do
            LDD_OUTPUT="$(LD_LIBRARY_PATH="$GTK_LINK_DIR:/app/lib" ldd "$GTK_LIBRARY" 2>&1 || true)"
            echo "ldd dependency scan (pass $pass):"
            printf '%s\n' "$LDD_OUTPUT"
            MISSING="$(printf '%s\n' "$LDD_OUTPUT" | awk '$2 == "=>" && $3 == "not" && $4 == "found" {print $1}')"
            if [ -z "$MISSING" ]; then
              break
            fi
            for soname in $MISSING; do
              case "$soname" in
                libc.so*|libpthread.so*|libm.so*|libdl.so*|librt.so*|ld-linux*|libresolv.so*|libnss_*|libutil.so*|libanl.so*|libthread_db.so*|libcrypt.so*)
                  echo "Refusing to override container glibc component: $soname" >&2
                  exit 1
                  ;;
              esac
              dependency="$(find "$GTK_RUNTIME_FILES" \( -type f -o -type l \) -name "$soname" -print -quit)"
              if [ -z "$dependency" ]; then
                echo "Unresolved GTK runtime dependency: $soname" >&2
                exit 1
              fi
              ln -sf "$dependency" "$GTK_LINK_DIR/$soname"
            done
          done

          FINAL_LDD_OUTPUT="$(LD_LIBRARY_PATH="$GTK_LINK_DIR:/app/lib" ldd "$GTK_LIBRARY" 2>&1 || true)"
          echo "Final GTK dependency scan:"
          printf '%s\n' "$FINAL_LDD_OUTPUT"
          if printf '%s\n' "$FINAL_LDD_OUTPUT" | grep -E '=>[[:space:]]+not found|version .* not found' >/dev/null; then
            echo "GTK runtime dependencies or symbol versions remain unresolved" >&2
            exit 1
          fi

          export LD_LIBRARY_PATH="$GTK_LINK_DIR:/app/lib"
          echo "GTK_LIBRARY=$GTK_LIBRARY"
          echo "GI_TYPELIB_PATH=$GI_TYPELIB_PATH"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          xvfb-run -a .m3-test-venv/bin/pytest -q tests/test_gnome51_icon_compatibility.py
