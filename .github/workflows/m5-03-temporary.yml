name: M5-03 Temporary Banner Regression

on:
  pull_request:
    branches: [feature]
    paths:
      - ".github/workflows/m5-03-temporary.yml"
      - "anura/window.py"
      - "tests/test_m5_02_ui_contracts.py"
  push:
    branches: [fix/ui-modernization-aligned]
    paths:
      - ".github/workflows/m5-03-temporary.yml"
      - "anura/window.py"
      - "tests/test_m5_02_ui_contracts.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-banner-regression:
    name: Portal banner GTK regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GSETTINGS_SCHEMA_DIR: builddir/data
      ANURA_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            gir1.2-adw-1 libadwaita-1-dev \
            gir1.2-gtksource-5 libgtksourceview-5-dev \
            gir1.2-notify-0.7 libnotify-dev \
            gir1.2-xdp-1.0 libportal1 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 python3-gst-1.0 \
            libxml2-utils blueprint-compiler tesseract-ocr tesseract-ocr-eng xvfb

      - name: Install Python dependencies
        run: |
          pip install uv
          uv venv --system-site-packages .venv
          uv sync --dev

      - name: Compile Blueprint UI and GResources
        run: |
          for blp in data/ui/*.blp; do
            blueprint-compiler compile "$blp" --output "${blp%.blp}.ui"
          done
          glib-compile-resources \
            data/io.github.d3m_sudo.anura.gresource.xml \
            --sourcedir=data --sourcedir=data/ui \
            --target=data/io.github.d3m_sudo.anura.gresource

      - name: Compile GSettings schema
        run: |
          mkdir -p builddir/data
          cp data/io.github.d3m_sudo.anura.gschema.xml builddir/data/
          glib-compile-schemas builddir/data/

      - name: Run portal banner regression tests
        env:
          DISPLAY: ":99"
          GDK_BACKEND: x11
          NO_AT_BRIDGE: "1"
          GTK_A11Y: none
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac >/tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if [ -S /tmp/.X11-unix/X99 ]; then break; fi
            sleep 0.25
          done
          uv run pytest tests/test_m5_02_ui_contracts.py::TestPortalBannerDismissal -v --timeout=30 --override-ini "addopts=-v --tb=short"
