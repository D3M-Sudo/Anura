name: Temporary authorized Anura branch rebase

on:
  push:
    branches:
      - fix/ui-modernization-aligned

permissions:
  contents: write

jobs:
  rebase:
    if: github.event.head_commit.message == 'chore: run authorized rebase of UI modernization branch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/ui-modernization-aligned
          fetch-depth: 0
          persist-credentials: true

      - name: Rebase onto current feature without flattening merge topology
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature
          git rebase --rebase-merges origin/feature
          git push --force-with-lease origin HEAD:refs/heads/fix/ui-modernization-aligned
